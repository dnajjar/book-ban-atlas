<!DOCTYPE html>
<html>
<head>
  <title>School Book Ban Atlas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>
  <script type="text/javascript" src="https://www.google.com/books/jsapi.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .awesomplete {
      z-index: 1000;
      width: 100%;
      max-width: 500px;
      top: 100%;
      left: 0;
    }

    #search-container {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
      z-index: 1001;
    }

    #search-field {
      width: 500px;
      height: 20px;
      font-size: 14px;
      padding: 10px;
      border: 2px solid #ccc;
      z-index: 1001;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    #results {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }

    .table-wrapper {
      overflow: auto;
      max-height: 25rem;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #333;
    }

    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      position: sticky;
      font-weight: bold;
      top: 0;
      z-index: 2;
      background: #f4f4f4;
      border-bottom: 2px solid #ddd;
    }

    #map {
      width: 100%;
      max-width: 800px;
      height: 400px;
      margin: 20px auto;
      border: none;
      border-radius: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    body #map .leaflet-container {
      background: #fff !important;
      background-color: #fff !important;
    }
    .sortable {
      cursor: pointer;
      user-select: none;
    }

    .sortable:hover {
      background-color: #f0f0f0;
    }

    .sortable::after {
      content: '  \2191 \2193';
      font-size: 0.8em;
      margin-left: 5px;
      color: #999;
    }

    .sortable.asc::after {
      content: '\2191';
      color: #333;
    }

    .sortable.desc::after {
      content: '\2193';
      color: #333;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      gap: 15px;
    }

    .pagination button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }

    .pagination button:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .pagination button:hover:not(:disabled) {
      background: #f0f0f0;
    }

    .page-info {
      font-weight: bold;
    }
    .description {
  max-width: 800px;
  margin: 20px auto;
  padding: 15px;
  background-color: #f8f9fa;
  border-left: 4px solid #007bff;
  font-size: 14px;
  line-height: 1.5;
}

.description a {
  color: #007bff;
  text-decoration: none;
}

.description a:hover {
  text-decoration: underline;
}
  </style>
</head>
<body>
  <div class="description">
    <p>This tool allows you to view all banned books from 2022-2025 based on data from <a href="https://pen.org/book-bans/" target="_blank">PEN America</a>. Search by book title, author, state, or school district to explore book challenges and bans across the United States.</p>
  </div>
  
  <div id="search-container">
    <h3>School Book Ban Atlas</h3>
    <input id="search-field" class="awesomplete" placeholder="Search by book title, author, state or school district" />
  </div>
  <div id="results"></div>
  
  <script type="module">
    import { renderResultsTable } from './resultsTable.js';
    import { initializeMap } from './map.js';

      google.books.load();

      function initialize() {
        var viewer = new google.books.DefaultViewer(document.getElementById('viewerCanvas'));
        viewer.load('ISBN:0738531367');
      }

      google.books.setOnLoadCallback(initialize);
    
    initializeMap();
    fetch('search_data.json')
      .then(response => response.json())
      .then(data => {
        const allData = {
          value: "All Books",
          type: "", 
          details: data.flatMap(item => item.details || [])
        };
      
      // Render table with all data initially
        renderResultsTable(allData, "results", true);
        const input = document.getElementById("search-field");
        const awesomplete = new Awesomplete(input, {
          minChars: 1,
          list: data.map(item => ({ label: `${item.value} - ${item.type}`, value: item.value })),
          item: function(suggestion, input) {
            const label = suggestion.label || suggestion.value;
            return Awesomplete.ITEM(`${label}`, input);
          },
          replace: function(suggestion) {
            this.input.value = suggestion.value;
          }
        });

        input.addEventListener("awesomplete-selectcomplete", function(event) {
          const query = event.text.value;
          const result = data.find(item => item.value.toLowerCase() === query.toLowerCase());

          const resultsContainer = document.getElementById("results");
          renderResultsTable(result, "results", true);
        });
      });
  </script>
  <div id="map"></div>
</body>
</html>
